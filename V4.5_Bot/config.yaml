# V4.5 系統設定檔（機構級）
# ${VAR} 會在載入時由 .env / 環境變數展開；${VAR:-default} 可指定預設值。

capital:
  total: ${TOTAL_CAPITAL:-1275.0}

ibkr:
  host: ${IBKR_HOST:-127.0.0.1}
  port: ${IBKR_PORT:-7497}          # 模擬 7497 / 實盤 7496 / Gateway 4002,4001
  client_id: ${IBKR_CLIENT_ID:-1}
  account_mode: ${IBKR_ACCOUNT_MODE:-paper}   # paper | live（實盤需明確設定）
  max_retries: 10

risk:
  # 小資金必須集中：$1,275 的部位若只有 $200，來回 $2 手續費就是 1% 的固定損耗。
  # 2 年回測（40 檔優質大型股）：1.5%/20% 倉 → 淨 -$19；2.0%/33% 倉 → 淨 +$34。
  max_risk_percent: 2.0
  max_loss_streak: 3
  reduced_risk_percent: 1.2
  # 集中度上限的單一事實來源是 portfolio.max_symbol_pct；
  # main.py 啟動時會注入覆蓋此值（此處僅為獨立使用/回測的預設）。
  max_position_pct: 33.0
  # 兩條獨立防線：回撤護利潤、絕對虧損護本金（刻意留出間距，避免同時觸發）
  max_drawdown_limit: 12.0        # 相對高位回撤 → 停機
  max_absolute_loss: 8.0          # 相對初始資本虧損 → 停機
  drawdown_warning_pct: 6.0       # 警戒帶：先降風險，不停機
  drawdown_warning_risk_pct: 0.75
  daily_loss_limit: 2.0
  vix_risk_cap: 1.5

portfolio:
  # max_symbol_pct 是單一標的集中度的單一事實來源（會注入 RiskManager）
  # 3 檔 × 33% ≈ 滿倉；散戶的優勢是可以集中，機構因授權限制不能。
  max_gross_exposure_pct: 99.0
  max_open_positions: 3
  max_sector_pct: 40.0
  max_symbol_pct: 33.0
  max_total_open_risk_pct: 6.0
  correlation_threshold: 0.8
  sector_map:
    AAPL: Technology
    NVDA: Technology
    AMD: Technology
    AVGO: Technology
    QCOM: Technology
    TXN: Technology
    AMAT: Technology
    LRCX: Technology
    KLAC: Technology
    ADI: Technology
    MU: Technology
    ADBE: Technology
    CRM: Technology
    NOW: Technology
    INTU: Technology
    PANW: Technology
    CDNS: Technology
    FTNT: Technology
    SNPS: Technology
    ORCL: Technology
    IBM: Technology
    GOOGL: Communication Services
    AMZN: Consumer Cyclical
    HD: Consumer Cyclical
    MCD: Consumer Cyclical
    WMT: Consumer Defensive
    COST: Consumer Defensive
    JPM: Financials
    MS: Financials
    AXP: Financials
    JNJ: Healthcare
    ABBV: Healthcare
    MRK: Healthcare
    SYK: Healthcare
    ISRG: Healthcare
    XOM: Energy
    CVX: Energy
    GE: Industrials
    HON: Industrials
    RTX: Industrials

backtest:
  apply_costs: true               # 回測套用手續費+滑點，避免高估實盤績效
  commission_per_share: 0.005     # IBKR 分層費率近似
  commission_minimum: 1.0
  exit_slippage_ticks: 1
  use_professional_mind: true     # 回測同樣走心態層審批鏈
  use_retail_mind: true           # 回測同樣走散戶思維層
  use_pacing: true                # 回測同樣套用月度節奏調節

execution:
  use_bracket_orders: true
  slippage_ticks: 1
  tick_size: 0.01
  order_timeout_seconds: 300
  protection_poll_interval_seconds: 60   # 有持倉時，掃描間隔內額外檢查停損

data:
  min_bars: 60
  max_age_trading_days: 2
  max_daily_move_pct: 40.0
  max_consecutive_failures: 3
  context_refresh_seconds: 3600
  fetch_timeout_seconds: 30       # 避免 yfinance 阻塞整個掃描週期

zscore:
  window: 60
  weights:
    momentum: 0.35
    volume: 0.25
    volatility: 0.20
    relative_strength: 0.20
  best_zone_min: 0.5
  best_zone_max: 1.5
  overheat_threshold: 2.5

volatility:
  vix_threshold: 25

trading:
  # $40 上限曾迫使系統只能選高波動小型股，2 年回測毛利為 -$17（完全無優勢）；
  # 放開後同一套訊號在優質大型股上毛利 +$628。價格上限不該當成風控工具。
  price_limit: 400
  # 上限只作防手殘；真正的倉位由風險%與 portfolio.max_symbol_pct 決定。
  max_shares: 200
  auto_trade: false        # 僅在 H1–H10 驗證並完成紙上交易後才開啟
  market_hours_only: true
  scan_interval_seconds: 300
  scan_interval_intraday: 60   # 盤中模式下的掃描間隔（秒）
  intraday_mode: false         # Swing：日線確認，不做盤中二次阻擋

regime:
  enabled: true
  vix_risk_on: 18.0
  vix_neutral: 22.0
  vix_risk_off: 28.0
  vix_crisis: 35.0
  breadth_risk_on: 65.0
  breadth_neutral: 45.0
  breadth_risk_off: 30.0
  risk_on_exposure: 100
  neutral_exposure: 60
  risk_off_exposure: 25
  crisis_exposure: 0
  risk_on_zscore_min: 0.45
  neutral_zscore_min: 0.5       # Swing 活躍：較低 Z 下限
  risk_off_zscore_min: 0.9
  crisis_zscore_min: 999.0
  credit_stress_pct: -2.0
  halt_on_crisis: true

intraday:
  enabled: true
  bar_size: "5 mins"
  fallback_interval: "5m"
  opening_range_minutes: 30
  vwap_pullback_pct: 0.8
  max_distance_from_vwap_pct: 1.5
  min_intraday_bars: 12
  require_above_vwap: false
  allow_opening_range_breakout: true
  skip_first_minutes: 5
  skip_last_minutes: 10
  max_bar_move_pct: 10.0          # 單根分鐘棒異常波動門檻（與日線品質閘門一致）
  fetch_timeout_seconds: 20       # 避免 yfinance 無限阻塞主循環

watchlist:
  # 優質流動性標的，且股價 ≤ 約 $370 —— 單一部位預算是 $1,275 × 33% ≈ $420，
  # 更貴的股票連 1 股都買不滿，掃描它們只是浪費時間（除非改用碎股）。
  # 2 年回測（同一套訊號、同一組門檻）：
  #   廣泛大型股 40 檔 → 5.67 單/月、毛/單 $2.30、淨 +2.8%
  #   動能傾向 40 檔   → 6.19 單/月、毛/單 $2.55、淨 +5.6%  ← 採用
  #   純科技 28 檔     → 3.05 單/月、毛/單 $2.87、淨 +4.4%
  core:
    - AAPL
    - NVDA
    - GOOGL
    - AMZN
    - JPM
  satellite:
    - AMD
    - AVGO
    - QCOM
    - TXN
    - AMAT
    - LRCX
    - KLAC
    - ADI
    - MU
    - ADBE
    - CRM
    - NOW
    - INTU
    - PANW
    - CDNS
    - FTNT
    - SNPS
    - ORCL
    - IBM
    - MS
    - AXP
    - GE
    - HON
    - RTX
    - ISRG
    - SYK
    - ABBV
    - MRK
    - JNJ
    - XOM
    - CVX
    - HD
    - MCD
    - WMT
    - COST
  # 月 8 單需要足夠的候選池：11 檔在 2 年回測只產生約 47 個買點（≈2/月）。
  # 深度分析 40 檔才能讓合格訊號量支撐目標頻率。
  max_active: 40
  max_core: 5
  max_satellite: 35
  refresh_hours: 72           # 每週刷新 satellite（0 = 關閉自動刷新）
  persist_file: data/watchlist.json
  correlation_threshold: 0.78
  scanner:
    enabled: true
    source: sp500
    max_scan: 250
    min_price: 20
    max_price: 400

strategies:
  - name: v45_core
    enabled: true
    require_structure: false     # Swing：用 MA50 趨勢（見 swing_trading.trend_mode）
    min_vol_ratio_high: 1.2
    max_vol_ratio_low: 0.8

# 散戶實務進場觸發：K 線形態只是其中一種，缺形態時改用回踩／突破／抬高低點。
# 其他 edge（趨勢、量能、波動、Z-Score）完全不放寬。
retail_triggers:
  enabled: true
  pullback_enabled: true
  pullback_ma: 20
  pullback_max_distance_pct: 3.5
  pullback_strength: 0.45
  breakout_enabled: true
  breakout_lookback: 20
  breakout_min_vol_ratio: 1.2
  breakout_strength: 0.60
  higher_low_enabled: true
  higher_low_strength: 0.40
  stop_atr_multiplier: 1.5
  stop_pct_fallback: 3.0

candle:
  min_strength: 0.30             # Swing 活躍門檻
  use_learned_stats: true          # Candle Lab 胜率统计只读影响信号
  min_learned_samples: 8
  min_learned_win_rate: 0.40       # 低于此胜率的形态不触发 BUY
  auto_learn_on_startup: true       # bot 启动时自动学习 watchlist
  learn_forward_bars: 10            # 形态后 N 根 K 衡量胜负
  learn_period: "6mo"

emotion:
  max_daily_trades: 2            # 月 8 單 ≈ 每週 2 單，單日 2 筆已足夠
  max_loss_streak: 3

# 月度交易節奏：落後目標才放寬「軟性」門檻，追上後自動收緊。
# 風控上限（停損、曝險、集中度）永不受此影響。
trade_pacing:
  enabled: true
  target_trades_per_month: 8
  max_trades_per_month: 12       # 硬上限：達到即停止新倉
  window_days: 30
  tolerance_pct: 25.0            # ±25% 視為節奏正常
  max_relax_level: 1.0
  state_file: data/trade_pacing.json
  relax_deltas:                  # 完全放寬時的位移，按落後程度線性縮放
    strong_min_confluence: -1
    moderate_min_confluence: -1
    moderate_min_edges: -1
    rsi_max: 4.0
    reject_rsi_above: 2.0
    zscore_max: 0.15
    zscore_min: -0.10
    min_candle_strength: -0.08
    min_vol_ratio_high: -0.10
    retail_min_score: -1
  floors:                        # 放寬的地板，確保閘門不會失效
    strong_min_confluence: 3
    moderate_min_confluence: 3
    moderate_min_edges: 3
    zscore_min: 0.30
    min_candle_strength: 0.20
    min_vol_ratio_high: 1.0
    retail_min_score: 4
  ceilings:
    rsi_max: 78.0
    reject_rsi_above: 82.0
    zscore_max: 1.80

# 專業散戶視角：機構看規模與估值，散戶看催化劑、成本與可操作性。
retail_mind:
  enabled: true
  min_retail_score: 5
  watch_score_margin: 2
  slippage_pct: 0.10
  max_cost_drag_pct: 1.20        # 來回手續費+滑點佔倉位比重上限（回本門檻）
  min_reward_risk: 1.4
  max_extension_above_ma50_pct: 22.0   # 不追離均線過遠的股票
  min_dollar_volume: 2000000     # 想賣時要有人接
  max_spread_proxy_pct: 10.0     # 日均振幅硬上限（跳動過大＝滑點失控）
  high_volatility_pct: 6.0       # 超過此值不擋，但扣分收斂倉位
  catalyst_min_news_score: 0.12
  catalyst_min_vol_ratio: 1.15
  catalyst_bonus: 2
  require_catalyst: false
  external_signal_bonus: 1
  allow_unprofitable_growth: true
  unprofitable_needs_catalyst: true
  size_ladder:                   # 評分 → 倉位比例
    - [9, 1.0]
    - [7, 0.75]
    - [6, 0.55]
    - [5, 0.4]

# 與外部金融 App 聯通：App 寫入 inbox，機械人審視後把結論寫回 verdicts。
external_signals:
  enabled: true
  directory: data/external_signals
  inbox_file: inbox.jsonl
  verdict_file: verdicts.jsonl
  processed_file: processed.json
  max_per_cycle: 5
  max_age_hours: 48
  allowed_symbols: []            # 留空 = 接受任何標的
  api_token: ${SIGNAL_API_TOKEN:-}   # scripts/signal_server.py 使用

swing_trading:
  enabled: true
  mode: swing
  trend_mode: swing
  moderate_buy_enabled: true
  moderate_min_edges: 3
  moderate_min_confluence: 3
  strong_min_confluence: 4
  moderate_size_factor: 0.5
  rsi_min: 28
  rsi_max: 72
  reject_rsi_above: 78
  zscore_max: 1.45
  require_sector_alignment: true
  sector_filter_mode: soft       # soft=只擋極弱板塊 | hard=必須領先 | off=關閉
  sector_block_rs_below: -4.0
  min_sector_rs_pct: -2.0
  top_sectors_count: 5
  sector_lookback: 1mo
  min_market_breadth: 25
  block_learned_losers: true

fundamental:
  # retail = 分級（A–D）而非一票否決；institutional = 原本的硬性門檻
  mode: retail
  enabled: true
  min_market_cap: 500000000     # retail 模式下僅作為 A/B 分級參考
  min_avg_volume: 1000000
  max_pe: 30
  min_earnings_growth: 10
  exclude_negative_eps: true    # 僅 institutional 模式生效
  cache_ttl_seconds: 86400
  retail:
    min_market_cap: 150000000   # 低於此為微型股 → D 級硬擋
    min_avg_volume: 400000      # 流動性不足 → D 級硬擋
    extreme_pe: 80              # 高於此列 C 級（需催化劑）
    allow_unprofitable: true    # 虧損成長股列 C 級，不直接排除

sector:
  enabled: true

news:
  enabled: true
  finnhub_key: ${FINNHUB_KEY:-}
  alpha_vantage_key: ${ALPHA_VANTAGE_KEY:-}
  sentiment_threshold: -0.2
  days_to_analyze: 3
  cache_ttl_seconds: 300
  fail_mode: open          # open=無新聞放行 | closed=來源全失敗則阻擋
  block_on_negative: true
  max_headlines: 20
  # 機構級消息稽核：外部 App 傳來的消息需經跨來源交叉驗證才影響決策
  credibility:
    enabled: true
    min_token_overlap: 0.28
    min_domains_for_verified: 2
    min_confidence_for_verified: 0.65
    min_confidence_for_partial: 0.40
    max_age_hours: 72
  sources:
    - name: yahoo
      enabled: true
      weight: 1.0
    - name: google_rss
      enabled: true
      weight: 0.8
    - name: finnhub
      enabled: true
      weight: 1.0
      api_key: ${FINNHUB_KEY:-}
    - name: alpha_vantage
      enabled: false
      weight: 1.2
      api_key: ${ALPHA_VANTAGE_KEY:-}

market_data:
  daily_sources: [ibkr, yfinance]
  intraday_sources: [ibkr, alpaca, yfinance]
  quote_sources: [ibkr, finnhub, yfinance, alpaca]
  max_quote_age_seconds: 900
  warn_drift_pct: 2.0
  block_stale_quote: false
  alpaca_api_key: ${ALPACA_API_KEY:-}
  alpaca_api_secret: ${ALPACA_API_SECRET:-}
  alpaca:
    data_url: https://data.alpaca.markets

notifier:
  enabled: false
  throttle_seconds: 300
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN:-}
    chat_id: ${TELEGRAM_CHAT_ID:-}
  email:
    enabled: false
    smtp_server: ${SMTP_SERVER:-}
    port: 587
    username: ${SMTP_USERNAME:-}
    password: ${SMTP_PASSWORD:-}
    recipient: ${ALERT_EMAIL_RECIPIENT:-}

logging:
  file: data/trading.log
  level: INFO
  max_bytes: 10485760      # 10 MB
  backup_count: 5

state:
  file: data/state.json

audit:
  blotter_file: data/trade_blotter.csv

professional_mind:
  enabled: true
  strategic_cash_enabled: true
  min_regime_score_to_trade: 40
  log_every_deliberation: false
  journal_file: data/execution_journal.csv
  # 共振分級：小資金不能把部位砍到 35%——手續費固定，砍半等於回本門檻翻倍。
  # 低共振的正確做法是「不做」，不是「做很小」。
  conviction_sizing:
    enabled: true
    full_size_score: 8
    reduced_score: 7
    minimum_score: 6
    reduced_factor: 0.85
    minimum_factor: 0.70
    weak_factor: 0.70
    reject_below: 6            # 低於 6 分直接拒絕，而不是縮到 35% 倉
  position_sizer:
    enabled: true
    atr_period: 14
    atr_multiplier: 2.0
    use_atr_stop: true
    kelly_enabled: false
    kelly_fraction: 0.25
    kelly_win_rate: 0.45
    kelly_avg_win: 1.5
    kelly_avg_loss: 1.0
    vix_scale_threshold: 25
    vix_scale_factor: 0.7
    max_risk_of_ruin: 0.05
  economic_calendar:
    enabled: true
    risk_multiplier: 0.5
    block_new_entries: false
  market_structure:
    enabled: true
    block_distribution_entries: true
  liquidity:
    enabled: true
    avoid_first_minutes: 5
    avoid_last_minutes: 10
  pdt:
    enabled: true
    min_equity: 25000
    max_day_trades_rolling: 3
  pyramid:
    enabled: true
    forbid_averaging_down: true
    min_profit_pct_to_add: 2.0
  portfolio_heat:
    enabled: true
    market_pullback_pct: 2.0
    max_symbol_weight_pct: 35
  themes:
    enabled: true
    auto_expand_watchlist: true
    active_themes:
      - ai_infrastructure
      - healthcare_recovery
