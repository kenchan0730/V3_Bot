# V4.5 系統設定檔（機構級）
# ${VAR} 會在載入時由 .env / 環境變數展開；${VAR:-default} 可指定預設值。

capital:
  total: ${TOTAL_CAPITAL:-385.0}

ibkr:
  host: ${IBKR_HOST:-127.0.0.1}
  port: ${IBKR_PORT:-7497}          # 模擬 7497 / 實盤 7496 / Gateway 4002,4001
  client_id: ${IBKR_CLIENT_ID:-1}
  account_mode: ${IBKR_ACCOUNT_MODE:-paper}   # paper | live（實盤需明確設定）
  max_retries: 10

risk:
  max_risk_percent: 2.0
  max_loss_streak: 3
  reduced_risk_percent: 1.0
  max_position_pct: 50.0
  max_drawdown_limit: 10.0
  max_absolute_loss: 8.0
  daily_loss_limit: 2.0
  vix_risk_cap: 1.5

portfolio:
  max_gross_exposure_pct: 100.0
  max_open_positions: 5
  max_sector_pct: 40.0
  max_symbol_pct: 50.0
  max_total_open_risk_pct: 6.0
  correlation_threshold: 0.8
  sector_map:
    AVAH: Healthcare
    EROC: Energy
    QXO: Industrials

execution:
  use_bracket_orders: true
  slippage_ticks: 1
  tick_size: 0.01
  order_timeout_seconds: 300

data:
  min_bars: 60
  max_age_trading_days: 2
  max_daily_move_pct: 40.0
  max_consecutive_failures: 3
  context_refresh_seconds: 3600

zscore:
  window: 60
  weights:
    momentum: 0.35
    volume: 0.25
    volatility: 0.20
    relative_strength: 0.20
  best_zone_min: 0.5
  best_zone_max: 1.5
  overheat_threshold: 2.5

volatility:
  vix_threshold: 25

trading:
  price_limit: 40
  max_shares: 20
  auto_trade: false        # 僅在 H1–H10 驗證並完成紙上交易後才開啟
  market_hours_only: true
  scan_interval_seconds: 300
  scan_interval_intraday: 60   # 盤中模式下的掃描間隔（秒）
  intraday_mode: true          # 啟用盤中進場確認（需 IBKR 或 yfinance 5m 備援）

regime:
  enabled: true
  vix_risk_on: 18.0
  vix_neutral: 22.0
  vix_risk_off: 28.0
  vix_crisis: 35.0
  breadth_risk_on: 65.0
  breadth_neutral: 45.0
  breadth_risk_off: 30.0
  risk_on_exposure: 100
  neutral_exposure: 60
  risk_off_exposure: 25
  crisis_exposure: 0
  risk_on_zscore_min: 0.5
  neutral_zscore_min: 0.8
  risk_off_zscore_min: 1.2
  crisis_zscore_min: 999.0
  credit_stress_pct: -2.0
  halt_on_crisis: true

intraday:
  enabled: true
  bar_size: "5 mins"
  fallback_interval: "5m"
  opening_range_minutes: 30
  vwap_pullback_pct: 0.8
  max_distance_from_vwap_pct: 1.5
  min_intraday_bars: 12
  require_above_vwap: false
  allow_opening_range_breakout: true
  skip_first_minutes: 5
  skip_last_minutes: 10

watchlist:
  core:
    - AVAH
    - EROC
    - QXO
  satellite:
    - F
    - SOFI
    - PLUG
    - SNAP
    - HOOD
    - NIO
    - INTC
    - AAL
  max_active: 18
  max_core: 5
  max_satellite: 12
  refresh_hours: 168           # 每週刷新 satellite（0 = 關閉自動刷新）
  persist_file: logs/watchlist.json
  correlation_threshold: 0.78
  scanner:
    enabled: true
    source: sp500
    max_scan: 120
    min_price: 5
    max_price: 40

strategies:
  - name: v45_core
    enabled: true
    require_structure: true
    min_vol_ratio_high: 1.5
    max_vol_ratio_low: 0.8

candle:
  min_strength: 0.4

emotion:
  max_daily_trades: 3
  max_loss_streak: 3

fundamental:
  enabled: true
  min_market_cap: 500000000
  min_avg_volume: 1000000
  max_pe: 30
  min_earnings_growth: 10
  exclude_negative_eps: true
  cache_ttl_seconds: 86400

sector:
  enabled: true

news:
  enabled: false
  finnhub_key: ${FINNHUB_KEY:-}
  sentiment_threshold: -0.2
  days_to_analyze: 3

notifier:
  enabled: false
  throttle_seconds: 300
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN:-}
    chat_id: ${TELEGRAM_CHAT_ID:-}
  email:
    enabled: false
    smtp_server: ${SMTP_SERVER:-}
    port: 587
    username: ${SMTP_USERNAME:-}
    password: ${SMTP_PASSWORD:-}
    recipient: ${ALERT_EMAIL_RECIPIENT:-}

logging:
  file: logs/trading.log
  level: INFO
  max_bytes: 10485760      # 10 MB
  backup_count: 5

state:
  file: logs/state.json

audit:
  blotter_file: logs/trade_blotter.csv

professional_mind:
  enabled: true
  strategic_cash_enabled: true
  min_regime_score_to_trade: 40
  log_every_deliberation: false
  journal_file: logs/execution_journal.csv
  position_sizer:
    enabled: true
    atr_period: 14
    atr_multiplier: 2.0
    use_atr_stop: true
    kelly_enabled: false
    kelly_fraction: 0.25
    kelly_win_rate: 0.45
    kelly_avg_win: 1.5
    kelly_avg_loss: 1.0
    vix_scale_threshold: 25
    vix_scale_factor: 0.7
    max_risk_of_ruin: 0.05
  economic_calendar:
    enabled: true
    risk_multiplier: 0.5
    block_new_entries: false
  market_structure:
    enabled: true
    block_distribution_entries: true
  liquidity:
    enabled: true
    avoid_first_minutes: 5
    avoid_last_minutes: 10
  pdt:
    enabled: true
    min_equity: 25000
    max_day_trades_rolling: 3
  pyramid:
    enabled: true
    forbid_averaging_down: true
    min_profit_pct_to_add: 2.0
  portfolio_heat:
    enabled: true
    market_pullback_pct: 2.0
    max_symbol_weight_pct: 35
  themes:
    enabled: true
    auto_expand_watchlist: true
    active_themes:
      - ai_infrastructure
      - healthcare_recovery
