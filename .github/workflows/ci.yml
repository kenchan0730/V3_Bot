name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    defaults:
      run:
        working-directory: V4.5_Bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: V4.5_Bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q core backtest main.py app.py dashboard.py

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=backtest \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=75

      - name: Verify config loads
        run: python -c "from core.config_loader import load_config; load_config('config.yaml'); print('config OK')"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: V4.5_Bot/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build + dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t v45-bot:ci V4.5_Bot

      # Deterministic: catches Dockerfile/dependency breakage that source-only
      # CI cannot see, without depending on market data being reachable.
      - name: Verify the bot can be constructed inside the image
        run: |
          docker run --rm -e TOTAL_CAPITAL=1275 -e IBKR_ACCOUNT_MODE=paper v45-bot:ci python -c "
          from core.config_loader import load_config
          from main import TradingBot
          config = load_config('config.yaml')
          bot = TradingBot(config, dry_run=True)
          assert bot.auto_trade is False
          assert bot.risk_mgr.max_position_pct == bot.portfolio.max_symbol_pct
          print('image OK: capital', bot.risk_mgr.total_capital)
          "

      # Network-dependent, so failures here do not block the build.
      - name: Dry-run one cycle (best effort)
        continue-on-error: true
        run: |
          timeout 300 docker run --rm \
            -e TOTAL_CAPITAL=1275 \
            -e IBKR_ACCOUNT_MODE=paper \
            v45-bot:ci \
            python main.py --once --dry-run
